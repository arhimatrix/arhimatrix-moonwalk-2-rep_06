<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 920" font-family="IBM Plex Mono, monospace">
<rect width="1500" height="920" fill="#0B0F16"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>
<text x="60" y="54" font-size="25" fill="#E6E4DE" font-weight="600">One plan file, from design model to as-built</text>
<text x="60" y="78" font-size="11" fill="#A0A7B3">Grasshopper exports operations, not trajectories · an executor per robot runs the same file in Isaac Sim or on the real Dragon · timing comes back measured</text>
<rect x="60" y="150" width="330" height="400" fill="#0e1420" stroke="#232A37" stroke-width="1.4" rx="3"/>
<text x="78" y="180" font-size="10" fill="#E88A6F" font-weight="600" letter-spacing="2">RHINO 8 · GRASSHOPPER</text>
<text x="78" y="204" font-size="12.5" fill="#E6E4DE" font-weight="600">One definition, eight groups</text>
<text x="78" y="228" font-size="9.5" fill="#A0A7B3">1  site and robots</text>
<text x="78" y="243.5" font-size="9.5" fill="#A0A7B3">2  structure (blocks, poses)</text>
<text x="78" y="259.0" font-size="9.5" fill="#A0A7B3">3  sequence</text>
<text x="78" y="274.5" font-size="9.5" fill="#A0A7B3">4  reach</text>
<text x="78" y="290.0" font-size="9.5" fill="#A0A7B3">5  schedule — who, what, when</text>
<text x="78" y="305.5" font-size="9.5" fill="#A0A7B3">6  preview · time slider</text>
<text x="78" y="321.0" font-size="9.5" fill="#A0A7B3">7  operations → ops.json ·</text>
<text x="78" y="336.5" font-size="9.5" fill="#6E7582">    Isaac plan · IFC 4D</text>
<text x="78" y="352.0" font-size="9.5" fill="#A0A7B3">8  read back · colour by state,</text>
<text x="78" y="367.5" font-size="9.5" fill="#6E7582">    re-plan from as-built</text>
<text x="78" y="383.0" font-size="9.5" fill="#A0A7B3"></text>
<text x="78" y="398.5" font-size="9.5" fill="#6E7582">a Python component holds the</text>
<text x="78" y="414.0" font-size="9.5" fill="#6E7582">Dragon kinematics, checked</text>
<text x="78" y="429.5" font-size="9.5" fill="#6E7582">against the lab model</text>
<text x="78" y="534" font-size="9.5" fill="#6fc0c3">status: working</text>
<rect x="450" y="190" width="270" height="320" fill="#0e1420" stroke="#E88A6F" stroke-width="1.4" rx="3"/>
<text x="468" y="220" font-size="10" fill="#E88A6F" font-weight="600" letter-spacing="2">PLAN FILE</text>
<text x="468" y="244" font-size="12.5" fill="#E6E4DE" font-weight="600">ops.json · moonwalk.ops/1</text>
<text x="468" y="268" font-size="9.5" fill="#6E7582">one record per operation:</text>
<text x="468" y="283.5" font-size="9.5" fill="#A0A7B3">id · robot · block · after ·</text>
<text x="468" y="299.0" font-size="9.5" fill="#A0A7B3">t_plan · frame</text>
<text x="468" y="314.5" font-size="9.5" fill="#A0A7B3"></text>
<text x="468" y="330.0" font-size="9.5" fill="#6E7582">vocabulary:</text>
<text x="468" y="345.5" font-size="9.5" fill="#A0A7B3">DRIVE  TURN  ARM_JOINTS</text>
<text x="468" y="361.0" font-size="9.5" fill="#A0A7B3">ARM_LINE  GRIP  HOLD</text>
<text x="468" y="376.5" font-size="9.5" fill="#A0A7B3">WAIT  SIGNAL</text>
<text x="468" y="392.0" font-size="9.5" fill="#A0A7B3"></text>
<text x="468" y="407.5" font-size="9.5" fill="#6E7582">events: set:37 · held:37 ·</text>
<text x="468" y="423.0" font-size="9.5" fill="#6E7582">pallet:free</text>
<rect x="780" y="190" width="250" height="320" fill="#0e1420" stroke="#232A37" stroke-width="1.4" rx="3"/>
<text x="798" y="220" font-size="10" fill="#E88A6F" font-weight="600" letter-spacing="2">PER ROBOT</text>
<text x="798" y="244" font-size="12.5" fill="#E6E4DE" font-weight="600">The executor</text>
<text x="798" y="268" font-size="9.5" fill="#A0A7B3">reads ops.json, resolves</text>
<text x="798" y="283.5" font-size="9.5" fill="#A0A7B3">‘after’ dependencies,</text>
<text x="798" y="299.0" font-size="9.5" fill="#A0A7B3">dispatches each operation</text>
<text x="798" y="314.5" font-size="9.5" fill="#A0A7B3"></text>
<text x="798" y="330.0" font-size="9.5" fill="#A0A7B3">execute() on a 30 Hz timer</text>
<text x="798" y="345.5" font-size="9.5" fill="#6E7582">holds the base whenever the</text>
<text x="798" y="361.0" font-size="9.5" fill="#6E7582">arm lags > 0.15 rad</text>
<text x="798" y="376.5" font-size="9.5" fill="#A0A7B3"></text>
<text x="798" y="392.0" font-size="9.5" fill="#6E7582">one node per robot — the</text>
<text x="798" y="407.5" font-size="9.5" fill="#6E7582">same code for two or three</text>
<text x="798" y="494" font-size="9.5" fill="#6fc0c3">status: next step</text>
<rect x="1090" y="120" width="350" height="250" fill="#0e1420" stroke="#232A37" stroke-width="1.4" rx="3"/>
<text x="1108" y="150" font-size="10" fill="#7C9CF2" font-weight="600" letter-spacing="2">ROS 2 · MOTION STACK</text>
<text x="1108" y="174" font-size="12.5" fill="#E6E4DE" font-weight="600">The real Dragon</text>
<text x="1108" y="198" font-size="9.5" fill="#A0A7B3">lvl1  /legN/joint_set · joint_read</text>
<text x="1108" y="213.5" font-size="9.5" fill="#A0A7B3">lvl2  /legN/set_ik_target · tip_pos</text>
<text x="1108" y="229.0" font-size="9.5" fill="#A0A7B3">JointSyncerRos: speed_safe · lerp</text>
<text x="1108" y="244.5" font-size="9.5" fill="#A0A7B3">IkSyncerRos: lerp</text>
<text x="1108" y="260.0" font-size="9.5" fill="#A0A7B3"></text>
<text x="1108" y="275.5" font-size="9.5" fill="#6E7582">ARM_JOINTS → speed_safe</text>
<text x="1108" y="291.0" font-size="9.5" fill="#6E7582">ARM_LINE → IK lerp waypoints</text>
<text x="1108" y="306.5" font-size="9.5" fill="#d0c47a">wheels + gripper: open with the lab</text>
<rect x="1090" y="420" width="350" height="230" fill="#0e1420" stroke="#232A37" stroke-width="1.4" rx="3"/>
<text x="1108" y="450" font-size="10" fill="#7C9CF2" font-weight="600" letter-spacing="2">NVIDIA ISAAC SIM</text>
<text x="1108" y="474" font-size="12.5" fill="#E6E4DE" font-weight="600">The physics check</text>
<text x="1108" y="498" font-size="9.5" fill="#A0A7B3">Dragon USD + blocks · PhysX:</text>
<text x="1108" y="513.5" font-size="9.5" fill="#A0A7B3">grasp, contact, seating,</text>
<text x="1108" y="529.0" font-size="9.5" fill="#A0A7B3">wheels on the ground</text>
<text x="1108" y="544.5" font-size="9.5" fill="#A0A7B3"></text>
<text x="1108" y="560.0" font-size="9.5" fill="#6E7582">kinematic playback: working</text>
<text x="1108" y="575.5" font-size="9.5" fill="#6E7582">physics build: in progress</text>
<line x1="390" y1="350" x2="448" y2="350" stroke="#6E7582" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="720" y1="350" x2="778" y2="350" stroke="#6E7582" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="1030" y1="310" x2="1088" y2="255" stroke="#6E7582" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="1030" y1="390" x2="1088" y2="500" stroke="#6E7582" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="1054" y="238" font-size="9" fill="#6E7582" text-anchor="middle">deploy</text>
<text x="1054" y="540" font-size="9" fill="#6E7582" text-anchor="middle">check</text>
<path d="M 1265,650 L 1265,700 L 225,700 L 225,552" fill="none" stroke="#7C9CF2" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#arr)"/>
<path d="M 1265,370 L 1265,420" fill="none" stroke="#232A37" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="745" y="692" font-size="10" fill="#7C9CF2" text-anchor="middle" style="paint-order:stroke;stroke:#0B0F16;stroke-width:4px">measured timing, block poses, contacts and failures go back into group 8 · the plan is re-run from the as-built state</text>
<text x="60" y="776" font-size="11" fill="#E6E4DE" font-weight="600">Build order</text>
<rect x="60" y="788" width="123.6" height="28" fill="none" stroke="#232A37" stroke-width="1.1" rx="14"/>
<text x="121.8" y="806" font-size="9.5" fill="#A0A7B3" text-anchor="middle">moonwalk library</text>
