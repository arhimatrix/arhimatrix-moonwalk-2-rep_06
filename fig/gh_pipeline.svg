<text x="1094.8500000000001" y="806" font-size="9.5" fill="#A0A7B3" text-anchor="middle">GH plugin</text>
<text x="60" y="872" font-size="9" fill="#6E7582">Interfaces from the Motion Stack manual and API (Neppel et al., 2025) · the 0.15 rad lag-hold rule carried over from Report 05</text>
<text x="60" y="888" font-size="9" fill="#6E7582">open with the lab: wheels and gripper topics, which limb is the arm, two-robot namespaces and clock, real joint speed limits</text>
