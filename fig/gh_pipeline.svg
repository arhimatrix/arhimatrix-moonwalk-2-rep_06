<line x1="527.2" y1="802" x2="551.2" y2="802" stroke="#6E7582" stroke-width="1.2" marker-end="url(#arr)"/>
<rect x="557.2" y="788" width="111.39999999999999" height="28" fill="none" stroke="#232A37" stroke-width="1.1" rx="14"/>
